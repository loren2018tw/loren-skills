name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 編碼與行尾斷言
        run: bash tests/check-encoding.sh
      - name: install.sh 語法檢查
        run: bash -n install.sh
      - name: install.sh 生命週期 smoke
        run: bash tests/install-smoke.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: pwsh 版本
        run: $PSVersionTable.PSVersion.ToString()
      - name: junction 生命週期 smoke（pwsh）
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/install-smoke.ps1
      - name: install.cmd 包裝器（DryRun）
        shell: cmd
        run: install.cmd -DryRun -Target "%TEMP%\loren-skills-cmd-test"
      - name: Windows PowerShell 5.1 必須乾淨失敗
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/ps51-failfast.ps1

  skill-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝 markitdown（docx 全管線煙霧用）
        run: python -m pip install 'markitdown[docx]==0.1.8'
      - name: 安裝 Pillow（標注煙霧用；本技能必要依賴）
        run: python -m pip install pillow
      - name: 安裝 CJK 字型（Linux 標注驗證）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 技能腳本煙霧測試
        run: python tests/script-smoke.py
